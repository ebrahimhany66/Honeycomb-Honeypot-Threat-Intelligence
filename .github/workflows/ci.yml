name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Block secrets and real data
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pcap$|\.pcapng$|\.db$|\.sqlite3?$'; then
            echo "Forbidden files were committed!"; exit 1
          fi
      - name: Run tests
        run: python -m pytest -q
